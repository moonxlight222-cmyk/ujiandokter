["🍬 Metabolik & endokrin","Guyton & Hall; PERKENI; Harrison",[
["Insulin vs glukagon","Insulin menurunkan gula darah (memasukkan glukosa ke sel). Glukagon menaikkannya. DM tipe 1 = kurang insulin (autoimun, muda). DM tipe 2 = sel resisten terhadap insulin (obesitas)."],
["Kriteria DM","GDP ≥126, GD2PP ≥200, GDS ≥200 dengan gejala klasik, atau HbA1c ≥6,5%. Prediabetes: GDPT 100-125, TGT 140-199."],
["Komplikasi DM","Akut: hipoglikemia, KAD (napas Kussmaul, keton +), HHS (gula sangat tinggi tanpa keton). Kronik: mikro (retinopati, nefropati, neuropati) dan makro (jantung, stroke, PAD)."],
["Tiroid","Hipertiroid: tidak tahan panas, berdebar, berat turun, tremor, TSH rendah. Hipotiroid: tidak tahan dingin, lemas, berat naik, konstipasi, bradikardia."],
["Kortisol","Cushing (kelebihan): wajah bulan, striae ungu, obesitas sentral. Addison (kekurangan): hipotensi, hiperpigmentasi, Na turun, K naik."]]],
["👂 Kepala & leher (THT, mata)","Buku Ajar THT-KL FKUI; Vaughan & Asbury Ophthalmology; Panduan Praktik Klinis FKTP",[
["Telinga","Luar, tengah (tiga tulang: malleus, incus, stapes), dalam (koklea dan vestibular). Tuli konduktif: Rinne negatif, Weber ke telinga sakit. Tuli sensorineural: Rinne positif, Weber ke telinga sehat."],
["Mata merah","Konjungtivitis: visus normal, tidak nyeri hebat. Glaukoma akut: nyeri hebat, visus turun, halo, pupil lebar. Uveitis: fotofobia, pupil kecil."],
["Faringitis","Skor Centor: demam, eksudat tonsil, KGB leher anterior nyeri, tidak batuk. Skor tinggi → curiga streptokokus, beri antibiotik."],
["Epistaksis","Sebagian besar anterior (area Kiesselbach). Duduk condong ke depan lalu tekan cuping hidung 10-15 menit. Jangan tengadah."],
["Rhinitis alergi","Bersin berulang, hidung gatal, sekret encer, konka pucat."]]],
["🤰 Reproduksi","Williams Obstetrics; Buku Acuan Nasional Pelayanan Kesehatan Maternal; Kemenkes",[
["Siklus haid","Fase folikular: FSH dan estrogen naik. Ovulasi sekitar hari ke-14 setelah lonjakan LH. Fase luteal: progesteron dominan."],
["Hitung HPL","Rumus Naegele: HPHT + 7 hari, dikurangi 3 bulan (atau ditambah 9 bulan)."],
["Kehamilan ektopik","Trias: amenore, nyeri perut, perdarahan. β-hCG positif, USG tidak menemukan kantung di uterus."],
["Preeklamsia","TD ≥140/90 setelah usia kehamilan 20 minggu dengan proteinuria atau disfungsi organ. Berat: ≥160/110. Pencegahan kejang: MgSO4."],
["Perdarahan antepartum","Plasenta previa: tanpa nyeri, darah merah segar. Solusio plasenta: nyeri, perut keras seperti papan."],
["Perdarahan pascasalin: 4T","Tone (atonia uteri, paling sering), Trauma, Tissue (sisa plasenta), Thrombin (gangguan pembekuan)."]]],
["🩸 Hematologi & imunologi","Hoffbrand Essential Haematology; WHO/Kemenkes Tata Laksana DBD",[
["Klasifikasi anemia","Lihat MCV. Mikrositik: defisiensi besi, talasemia. Normositik: penyakit kronik, perdarahan akut. Makrositik: defisiensi B12 atau folat."],
["Hemostasis","Gangguan trombosit/pembuluh darah: petekie, mimisan. Gangguan faktor pembekuan: hematom dalam, hemartrosis."],
["DBD","Tiga fase: demam, kritis, pemulihan. Fase kritis justru saat demam turun (hari 3-5): hematokrit naik, trombosit turun, risiko syok. Waspada nyeri perut, muntah terus, perdarahan."],
["Golongan darah","O = donor universal sel darah merah, AB = resipien universal. Golongan A punya antigen A dan antibodi anti-B."],
["Anafilaksis","Epinefrin IM di paha lateral dulu, baru obat lain (antihistamin, steroid hanya penunjang)."]]],
["🚽 Urogenital","Guyton & Hall; Buku Ajar Ilmu Penyakit Dalam; Panduan Praktik Klinis FKTP",[
["Nefron","Tiga proses: filtrasi di glomerulus, reabsorpsi, sekresi. LFG normal sekitar 90-120 mL/menit. PGK: LFG <60 selama >3 bulan atau ada kerusakan ginjal."],
["Nefritik vs nefrotik","Nefritik: hematuria, hipertensi, edema ringan (contoh GNAPS pasca faringitis). Nefrotik: proteinuria >3,5 g/hari, hipoalbumin, edema berat, kolesterol tinggi."],
["ISK","Sistitis: disuria, sering BAK, nyeri suprapubik. Pielonefritis: demam, nyeri pinggang. Wanita lebih sering karena uretra pendek. Kuman tersering: E. coli."],
["Batu saluran kemih","Kolik hebat dari pinggang ke selangkangan, sering ada hematuria. Minum banyak dan analgesik."],
["BPH","Pria tua dengan pancaran lemah, nokturia. Pada colok dubur prostat membesar, licin, kenyal."]]],
["🦴 Kulit & muskuloskeletal","Fitzpatrick Dermatology; Apley Orthopaedics; PERDOSKI; Panduan Praktik Klinis FKTP",[
["Lesi primer kulit","Makula (datar), papul (<1 cm menonjol), plak, vesikel (<1 cm berisi cairan), bula (>1 cm), pustul, nodul."],
["Infeksi kulit","Impetigo: krusta kuning seperti madu. Tinea: cincin dengan tepi aktif. Skabies: gatal malam, sela jari, permetrin 5%. Kusta: bercak mati rasa."],
["Fraktur","Tanda pasti: deformitas, krepitasi, gerak abnormal. Foto rontgen 2 posisi, mencakup 2 sendi. Fraktur terbuka: antibiotik, debridemen, stabilisasi."],
["Radang sendi","OA: nyeri bertambah dengan aktivitas, kaku pagi <30 menit. RA: simetris, kaku pagi >1 jam. Gout: nyeri mendadak di MTP I (podagra), asam urat tinggi."]]],
["🧠 Neurobehavior","Adams & Victor Principles of Neurology; PERDOSSI; PPDGJ-III/DSM-5",[
["UMN vs LMN","UMN: spastik, refleks naik, Babinski positif. LMN: flaksid, refleks turun, atrofi, fasikulasi."],
["GCS","Mata 4 + Verbal 5 + Motor 6 = 3-15. ≤8 berarti cedera berat dan perlu proteksi jalan napas."],
["Stroke","Sekitar 85% iskemik. Kenali dengan BE-FAST (wajah mencong, lengan lemah, bicara pelo, waktu). Iskemik <4,5 jam bisa ditrombolisis setelah CT menyingkirkan perdarahan."],
["Sakit kepala","Migrain: sebelah, berdenyut, mual, fotofobia. Tension: seperti diikat, kedua sisi. Red flag: sakit kepala sangat hebat mendadak, demam + kaku kuduk, defisit neurologis."],
["Kejang demam sederhana","Usia 6 bulan-5 tahun, demam, kejang umum, <15 menit, tidak berulang dalam 24 jam. Kejang aktif: diazepam rektal."],
["Gangguan jiwa","Depresi: sedih atau anhedonia ≥2 minggu (SSRI). Psikosis: halusinasi, waham. Skizofrenia bila gejala psikotik >1 bulan."]]],
["🩺 Keterampilan klinis dasar","Buku Panduan Keterampilan Klinis FKUI; Bates Guide to Physical Examination; WHO Hand Hygiene; AHA/ERC BLS",[
["Anamnesis","Urutan: identitas, keluhan utama, riwayat penyakit sekarang, dahulu, keluarga, sosial. Untuk nyeri pakai OPQRST: Onset, Provocation, Quality, Radiation, Severity, Time."],
["Tanda vital dewasa","Nadi 60-100, napas 12-20, suhu sekitar 36,5-37,5 °C, SpO2 ≥95%, TD optimal <120/80."],
["Urutan pemeriksaan","Umumnya inspeksi, palpasi, perkusi, auskultasi (IPPA). Khusus abdomen: inspeksi, auskultasi, perkusi, palpasi, supaya bising usus tidak berubah oleh palpasi."],
["5 momen cuci tangan WHO","Sebelum menyentuh pasien, sebelum tindakan aseptik, setelah terpapar cairan tubuh, setelah menyentuh pasien, setelah menyentuh lingkungan pasien."],
["BLS dewasa","Cek respons dan napas, panggil bantuan, kompresi dada 100-120/menit, kedalaman 5-6 cm, rasio 30:2, pakai AED secepatnya."],
["ATLS primary survey","A (jalan napas + proteksi servikal), B (napas), C (sirkulasi, hentikan perdarahan), D (disabilitas/GCS), E (paparan dan cegah hipotermia)."]]],
["⚖️ Etika, komunikasi, layanan primer, informasi, mawas diri","KODEKI; SKDI; Kemenkes (imunisasi, ANC); Calgary-Cambridge; Sackett EBM",[
["4 prinsip etika","Autonomi (hak memutuskan), beneficence (berbuat baik), nonmaleficence (jangan membahayakan), justice (adil). Informed consent dan rahasia medis bagian dari autonomi dan kepercayaan."],
["Komunikasi efektif","SPIKES untuk berita buruk (Setting, Perception, Invitation, Knowledge, Emotion, Summary). Dengarkan dulu, hindari istilah rumit, pakai teach-back untuk memastikan pasien paham."],
["Layanan primer","Puskesmas adalah FKTP. Dokter berperan promotif, preventif, kuratif, rehabilitatif. Kompetensi 4A SKDI: dokter umum harus mampu menangani tuntas. Rujuk bila di luar kompetensi atau sarana."],
["Imunisasi dasar","Hepatitis B <24 jam setelah lahir, BCG, polio, DPT-HB-Hib, campak/rubela."],
["Pengelolaan informasi (EBM)","Hierarki bukti: meta-analisis/SR > RCT > kohort > kasus-kontrol > laporan kasus. Sensitivitas = kemampuan menjaring yang sakit; spesifisitas = kemampuan menyingkirkan yang sehat."],
["Mawas diri","Kenali batas kemampuan, minta bantuan atau supervisi, refleksikan kesalahan, jaga kesehatan mental sendiri, dan terus belajar."]]]];

const X=[
[1,["Cara kerja jantung (versi simpel)","Jantung adalah pompa otot dengan 4 ruang yang mendorong darah ke seluruh tubuh.",["Bayangkan sebuah rumah dengan 4 kamar. Dua kamar atas disebut atrium (kanan dan kiri), fungsinya seperti ruang tunggu. Dua kamar bawah disebut ventrikel (kanan dan kiri), fungsinya mesin pompa.","Jalur darah: darah yang miskin oksigen masuk ke atrium kanan, turun ke ventrikel kanan, lalu dipompa ke paru untuk mengambil oksigen. Darah kaya oksigen kembali ke atrium kiri, turun ke ventrikel kiri, lalu dipompa ke seluruh tubuh.","Dinding ventrikel kiri paling tebal karena tugasnya paling berat: mendorong darah sampai ujung jari kaki. Katup bekerja seperti pintu satu arah supaya darah tidak balik."],"Kanan ke paru, kiri ke seluruh tubuh."]],
[1,["Kenapa tekanan darah bisa tinggi?","Tekanan darah tinggi terjadi ketika darah mendorong dinding pembuluh terlalu kuat dalam waktu lama.",["Bayangkan selang air. Tekanan naik kalau pompanya kuat, airnya banyak, atau selangnya menyempit. Pada tubuh: jantung memompa kuat, garam berlebih menahan air sehingga volume darah naik, dan pembuluh yang kaku atau menyempit.","Hipertensi sering tanpa gejala, makanya dijuluki silent killer. Dalam jangka panjang merusak jantung, otak (stroke), ginjal, dan mata.","Pencegahan: kurangi garam, olahraga teratur, jaga berat badan, tidak merokok. Kalau perlu, minum obat teratur sesuai anjuran dokter."],"Diagnosis hipertensi: TD ≥140/90 pada pengukuran berulang."]],
[2,["Perjalanan udara sampai ke darah","Udara melewati saluran napas lalu bertukar gas di alveolus.",["Urutannya: hidung → faring → laring → trakea → bronkus → bronkiolus → alveolus.","Alveolus seperti balon mungil yang dilapisi pembuluh kapiler. Oksigen berpindah dari alveolus ke darah, karbon dioksida berpindah dari darah ke alveolus untuk dihembuskan. Perpindahan ini lewat difusi (dari konsentrasi tinggi ke rendah).","Kalau alveolus terisi cairan atau nanah (pneumonia) atau salurannya menyempit (asma), pertukaran gas terganggu sehingga pasien sesak."],"Pertukaran gas terjadi di alveolus, bukan di trakea atau bronkus."]],
[3,["Hepar, pabrik serbaguna tubuh","Hepar (hati) bekerja sebagai filter, gudang, dan pabrik sekaligus.",["Tugasnya: menyaring racun dan obat, menyimpan gula sebagai glikogen, membuat empedu untuk mencerna lemak, serta membuat protein seperti albumin dan faktor pembekuan darah.","Kalau hepar rusak: kulit dan mata kuning (bilirubin menumpuk), perut membesar karena cairan (asites), kaki bengkak (albumin turun), dan mudah memar atau berdarah (faktor pembekuan turun)."],"Hepar rusak → kuning, bengkak, mudah berdarah."]],
[4,["Gula darah: kisah kunci dan gembok","Insulin adalah kunci yang membuka pintu sel supaya glukosa bisa masuk.",["Glukosa itu bahan bakar, sel itu rumah. Tanpa kunci (insulin), glukosa menumpuk di darah.","DM tipe 1: tubuh tidak membuat kunci (insulin hampir tidak ada). DM tipe 2: kunci ada, tetapi gemboknya berkarat (resisten insulin), sering terkait obesitas dan kurang gerak.","Gejala klasik 3P: poliuria (sering BAK), polidipsia (sering haus), polifagia (sering lapar), disertai berat badan turun."],"Gula tinggi di darah tetapi sel kelaparan."]],
[7,["Kenapa hematokrit naik pada DBD?","Pada DBD pembuluh darah menjadi bocor, plasma keluar, darah jadi lebih kental.",["Virus dengue dibawa nyamuk Aedes aegypti yang menggigit siang hari. Pencegahan: 3M plus (menguras, menutup, mengubur) dan menghindari gigitan.","Saat fase kritis, plasma bocor dari pembuluh ke ruang antar sel. Jumlah sel darah relatif lebih banyak dibanding cairan, sehingga hematokrit naik. Bocor banyak bisa membuat tekanan turun dan terjadi syok.","Pengobatannya mengganti cairan dengan tepat dan memantau hematokrit serta trombosit."],"Hematokrit naik + trombosit turun = waspada DBD."]],
[0,["Sistem imun seperti tentara negara","Tubuh punya lapis pertahanan: tembok, pasukan cepat, lalu pasukan khusus.",["Kulit dan selaput lendir = tembok benteng. Neutrofil = pasukan cepat yang datang pertama. Makrofag = tentara pemakan kuman. Sel T = komandan dan pembunuh sel terinfeksi. Sel B = pabrik peluru (antibodi).","Vaksin = latihan perang: tubuh dikenalkan pada versi lemah atau potongan kuman supaya sel memori siap kalau musuh asli datang."],"Vaksin melatih sel memori."]],
[8,["Ginjal, penyaring dan pengatur","Ginjal menyaring darah sekitar 180 liter per hari, tetapi urin yang keluar hanya 1-2 liter.",["Fungsi: membuang limbah (urea, kreatinin), mengatur air, garam dan keasaman, mengatur tekanan darah (hormon renin), membuat eritropoietin (merangsang sel darah merah), dan mengaktifkan vitamin D.","Kalau ginjal gagal: limbah menumpuk, edema, tekanan darah tinggi, anemia, dan tulang rapuh."],"Ginjal rusak → anemia dan hipertensi ikut muncul."]],
[6,["Kehamilan: dari sel telur ke bayi","Pembuahan terjadi di tuba, lalu embrio menempel di rahim sekitar hari ke-6 sampai 7.",["Plasenta tumbuh dan memberi makanan serta oksigen ke janin. Hormon hCG dihasilkan setelah implantasi, itulah yang dideteksi tes kehamilan.","Asam folat sebelum dan awal hamil mencegah cacat tabung saraf.","Tanda bahaya ibu hamil: perdarahan, kejang, sakit kepala hebat dengan pandangan kabur, ketuban pecah dini, gerak janin berkurang. Segera ke fasilitas kesehatan."],"Perdarahan pada kehamilan = tanda bahaya."]],
[10,["Neuron dan peta otak","Neuron adalah sel saraf yang mengirim sinyal listrik.",["Dendrit menerima sinyal, badan sel memproses, akson menghantar, sinaps adalah sambungan antar neuron yang memakai zat kimia (neurotransmiter).","Peta lobus: frontal (gerak, keputusan, bicara), parietal (rasa raba), temporal (pendengaran, memori), oksipital (penglihatan).","Karena itu gejala stroke tergantung lokasi: area gerak terkena → lumpuh, area bicara terkena → afasia."],"Lokasi lesi menentukan gejala."]],
[11,["Mengukur tekanan darah yang benar","Teknik yang salah bisa membuat angka meleset.",["Pasien duduk tenang 5 menit, punggung bersandar, kaki tidak menyilang, lengan setinggi jantung, manset sesuai ukuran lengan, tidak berbicara.","Pompa manset sampai di atas perkiraan sistolik, turunkan pelan. Bunyi Korotkoff pertama = sistolik, bunyi menghilang = diastolik. Ulangi 1-2 menit kemudian."],"Lengan harus setinggi jantung."]],
[12,["Informed consent langkah demi langkah","Informed consent adalah persetujuan pasien setelah mendapat penjelasan yang cukup.",["Dokter menjelaskan diagnosis, tindakan, manfaat, risiko, dan alternatif dengan bahasa mudah. Pasien harus kompeten, paham, dan menyetujui tanpa paksaan.","Pasien boleh menolak. Pada keadaan gawat darurat yang mengancam nyawa dan tidak ada yang bisa dimintai persetujuan, dokter dapat bertindak demi menyelamatkan pasien."],"Setuju harus sukarela dan paham."]]];
